name: tar-kernel
on: workflow_dispatch
jobs:
  tar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout kernel tree
        uses: actions/checkout@v4
        with:
          repository: HwFans/AQM_AL10HN_02_HM_opensource
          fetch-depth: 1
          sparse-checkout: kernel
      - name: Tar kernel
        run: |
          du -sh kernel
          find kernel -type f | wc -l
          tar czf /tmp/kernel.tgz kernel
          ls -lh /tmp/kernel.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-src
          path: /tmp/kernel.tgz
          retention-days: 7