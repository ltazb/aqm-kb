name: build-orlando
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout kernel tree
        uses: actions/checkout@v4
        with:
          repository: HwFans/AQM_AL10HN_02_HM_opensource
          fetch-depth: 1
          sparse-checkout: kernel
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev python3 rsync cpio kmod unzip xz-utils device-tree-compiler
      - name: Fetch toolchains and symlink prebuilts
        run: |
          set -e
          cd /opt
          sudo git clone -q --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc49
          sudo git clone -q --depth 1 https://github.com/picasso09/clang-9.0.3-r353983c1.git clanghw
          sudo chmod -R +x /opt/gcc49/bin /opt/clanghw/bin || true
          WS="$GITHUB_WORKSPACE"
          PARENT="$(dirname "$WS")"
          for ROOT in "$WS" "$PARENT"; do
            sudo mkdir -p "$ROOT/prebuilts/clang/host/linux-x86"
            sudo ln -sfn /opt/clanghw "$ROOT/prebuilts/clang/host/linux-x86/clang-r353983c"
          done
          "$WS/kernel/../../prebuilts/clang/host/linux-x86/clang-r353983c/bin/clang" --version | head -1
      - name: Configure
        run: |
          set -euo pipefail
          cd kernel
          export PATH=/opt/gcc49/bin:/opt/clanghw/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android-
          make O=../out ARCH=arm64 merge_orlando_defconfig > /tmp/cfg.log 2>&1
          tail -3 /tmp/cfg.log
          ls -la ../out/.config
      - name: Build with full error capture
        run: |
          set +e
          cd kernel
          export PATH=/opt/gcc49/bin:/opt/clanghw/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android-
          make O=../out ARCH=arm64 -j$(nproc) > /tmp/build.log 2>&1
          RC=$?
          echo "MAKE_RC=$RC"
          echo "===== ERROR LINES ====="
          grep -n -E "error:|Error [0-9]|fatal error|undefined reference" /tmp/build.log | head -40
          echo "===== LAST 40 ====="
          tail -40 /tmp/build.log
          echo "===== END ====="
          exit 0
      - name: Show results
        if: always()
        run: |
          ls -la out/ 2>/dev/null | head -20
          ls -la out/arch/arm64/boot/ 2>/dev/null | head
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orlando
          path: |
            out/vmlinux
            out/System.map
            out/arch/arm64/boot/Image.gz
            out/.config