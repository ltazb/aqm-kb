name: build-orlando
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout kernel tree
        uses: actions/checkout@v4
        with:
          repository: HwFans/AQM_AL10HN_02_HM_opensource
          fetch-depth: 1
          sparse-checkout: kernel
      - name: Restore out
        uses: actions/cache@v4
        with:
          path: out
          key: orlando-lld-v7-${{ github.run_number }}
          restore-keys: |
            orlando-clang-v5-
            orlando-chunk-v1
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld bc bison flex libssl-dev libelf-dev python3
          ld.lld --version | head -1
      - name: Toolchain
        run: |
          git clone --depth 1 https://github.com/picasso09/clang-9.0.3-r353983c1.git /tmp/clanghw 2>&1 | tail -1
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /tmp/gcc49 2>&1 | tail -1
          sudo mkdir -p /prebuilts/clang/host/linux-x86
          sudo ln -sfn /tmp/clanghw /prebuilts/clang/host/linux-x86/clang-r353983c
          for d in "$GITHUB_WORKSPACE" "$(dirname $GITHUB_WORKSPACE)"; do
            sudo mkdir -p "$d/prebuilts/clang/host/linux-x86"
            sudo ln -sfn /tmp/clanghw "$d/prebuilts/clang/host/linux-x86/clang-r353983c"
          done
          nproc
      - name: Mount and patch
        run: |
          sudo mkdir -p /k
          sudo mount --bind "$GITHUB_WORKSPACE/kernel" /k
          mkdir -p out
          python3 -c "
import re
p='/k/Makefile'
s=open(p).read()
s2=re.sub(r'(?ms)^prepare-compiler-check:.*?(?=^[A-Za-z0-9_.-]+:)', 'prepare-compiler-check: FORCE\n\t@true\n\n', s, count=1)
open(p,'w').write(s2)
print('patched' if s2!=s else 'nochange')
"
      - name: Configure
        run: |
          set +e
          cd /k
          export PATH=/tmp/gcc49/bin:/tmp/clanghw/bin:$PATH
          if [ ! -f "$GITHUB_WORKSPACE/out/.config" ]; then
            make O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=/tmp/gcc49/bin/aarch64-linux-android- merge_orlando_defconfig > /tmp/cfg.log 2>&1
            echo "CFG_RC=$?"
            tail -4 /tmp/cfg.log
          else
            echo "config exists"
          fi
      - name: Build with lld
        run: |
          set +e
          cd /k
          export PATH=/tmp/gcc49/bin:/tmp/clanghw/bin:$PATH
          make O="$GITHUB_WORKSPACE/out" ARCH=arm64 CROSS_COMPILE=/tmp/gcc49/bin/aarch64-linux-android- SKIP_STACK_VALIDATION=1 LD=ld.lld KCFLAGS="-Wno-error" -j4 vmlinux > /tmp/build.log 2>&1
          echo "MAKE_RC=$?"
          echo "OBJ=$(find "$GITHUB_WORKSPACE/out" -name "*.o" | wc -l)"
          ls -la "$GITHUB_WORKSPACE/out/vmlinux" 2>/dev/null || echo no_vmlinux
          echo "=== errors ==="
          grep -n -E "error:|Error [0-9]" /tmp/build.log | head -8
          echo "=== last ==="
          tail -6 /tmp/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orlando-out
          path: |
            out/vmlinux
            out/System.map
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn